<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호호모빌리티 | 환불 규정</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/site.css">
    <script src="/js/site-components.js" defer></script>
</head>
<body class="flex flex-col min-h-screen">
    <site-header lang="ko"></site-header>

    <main class="flex-grow pt-32 pb-16 px-6">
        <div class="max-w-4xl mx-auto">
            <h2 class="text-3xl font-black text-[#102C57] mb-8 border-b pb-4 tracking-tighter text-center">취소 및 환불 규정</h2>
            
            <div class="bg-white p-8 md:p-12 rounded-2xl border border-gray-100 space-y-8 shadow-lg">
                
                <!-- Notice Banner -->
                <div class="bg-blue-50 p-5 border border-blue-100 rounded-xl text-sm md:text-base text-blue-800 font-medium flex items-start md:items-center gap-3">
                    <span class="text-xl leading-none">💡</span> 
                    <p>무형의 서비스 및 맞춤형 배차 특성상 아래 환불 규정이 엄격하게 적용되오니, 예약 전 반드시 확인해 주시기 바랍니다.</p>
                </div>
                
                <!-- Policy Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 100% Refund Card -->
                    <div class="bg-green-50/50 border border-green-200 rounded-2xl p-8 text-center flex flex-col justify-center items-center hover:bg-green-50 transition duration-300 shadow-sm">
                        <div class="text-green-800 font-bold text-lg mb-3">이용 24시간 전까지 취소 시</div>
                        <div class="text-green-600 font-black text-3xl md:text-4xl">100% 환불</div>
                        <div class="text-green-700 text-sm mt-3 font-medium px-4 py-1 bg-green-100 rounded-full">결제 금액 전액 환불</div>
                    </div>

                    <!-- No Refund Card -->
                    <div class="bg-red-50/50 border border-red-200 rounded-2xl p-8 text-center flex flex-col justify-center items-center hover:bg-red-50 transition duration-300 shadow-sm">
                        <div class="text-red-800 font-bold text-lg mb-3">당일 취소 및 노쇼(No-show)</div>
                        <div class="text-red-500 font-black text-3xl md:text-4xl">환불 불가</div>
                        <div class="text-red-600 text-sm mt-3 font-medium px-4 py-1 bg-red-100 rounded-full">예약금 반환 불가</div>
                    </div>
                </div>

                <!-- Process Section -->
                <div class="pt-8 border-t border-slate-100 space-y-4">
                    <h3 class="font-bold text-[#102C57] text-lg flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-[#2E5C9E]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        환불 절차 안내
                    </h3>
                    <div class="bg-slate-50 p-6 rounded-xl border border-slate-100">
                        <p class="text-sm md:text-base text-slate-600 leading-relaxed">
                            환불 요청은 <strong>공식 카카오톡 채널, 왓츠앱</strong> 또는 <strong>고객센터 전화(010-6674-8253)</strong>를 통해서만 접수받습니다.<br class="hidden md:block">
                            접수 확인 후 결제 수단에 따라 근무일 기준 <strong>3~5일 이내</strong>에 처리가 완료됩니다.
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <site-footer lang="ko"></site-footer>
</body>
</html>
