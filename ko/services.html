<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOHO Mobility | Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/site.css">
    <script src="/js/site-components.js" defer></script>
</head>
<body class="flex flex-col min-h-screen">
    <site-header active="services" lang="ko"></site-header>

    <main class="flex-grow pt-32 pb-24">
        <section class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="mb-16 text-center">
                <h2 class="text-3xl md:text-4xl font-bold text-[#102C57] mb-4 tracking-tighter font-black">Customized Full-Lineup Dispatch Service</h2>
                <p class="text-lg text-slate-600">All vehicles include a <strong>free meet & greet picket service and all parking/toll fees</strong>.</p>
            </div>
            
            <div id="service-product-list" class="flex flex-col gap-12"></div>
            
        </section>
    </main>

    <div id="dynamic-modal" class="fixed inset-0 z-[60] hidden bg-black/80 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-3xl max-h-[85vh] rounded-3xl overflow-hidden flex flex-col shadow-2xl">
            <div class="p-6 border-b flex justify-between items-center bg-white sticky top-0 z-10">
                <h3 id="modal-title" class="text-xl font-bold text-[#102C57]">Information</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-black text-3xl leading-none">&times;</button>
            </div>
            <div id="modal-content" class="overflow-y-auto p-4 md:p-8 space-y-6 bg-slate-50">
                </div>
            <div class="p-6 border-t bg-white flex flex-col sm:flex-row gap-3">
                <button onclick="closeModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition">Close</button>
                <a href="contact" class="flex-[2] py-3 bg-[#102C57] text-white text-center rounded-xl font-bold hover:bg-[#1a3e75] transition">Inquire about this vehicle</a>
            </div>
        </div>
    </div>

    <site-footer lang="ko"></site-footer>

    <script>
        let allData = [];

        document.addEventListener('DOMContentLoaded', () => {
            // 영문 JSON 데이터를 절대 경로로 불러오기 (루트의 data 폴더)
            fetch('data/service.json').then(r => r.json()).then(data => {
                allData = data;
                const container = document.getElementById('service-product-list');
                
                container.innerHTML = data.map((item, index) => `
                    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden flex flex-col md:flex-row transition hover:shadow-xl group">
                        
                        <div class="md:w-1/2 h-72 md:h-auto min-h-[320px] overflow-hidden bg-slate-100 cursor-pointer relative" onclick="openModal(${index}, 'image')">
                            <img src="/${item.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://via.placeholder.com/800x600?text=Vehicle'">
                            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition duration-300 flex items-center justify-center">
                                <span class="bg-white/90 text-[#102C57] font-bold px-4 py-2 rounded-full opacity-0 group-hover:opacity-100 transition duration-300 transform translate-y-4 group-hover:translate-y-0">View Detailed Photos 🔍</span>
                            </div>
                        </div>
                        
                        <div class="md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
                            <p class="text-sm font-bold text-[#2E5C9E] mb-2">${item.sub_title}</p>
                            <h3 class="text-3xl font-black text-[#102C57] mb-6">${item.name}</h3>
                            <p class="text-slate-600 text-base md:text-lg leading-relaxed mb-8 flex-grow">${item.description}</p>
                            
                            <div class="flex flex-col sm:flex-row gap-3 mt-auto">
                                <button onclick="openModal(${index}, 'price')" class="flex-1 bg-white border-2 border-[#102C57] text-[#102C57] font-bold py-3.5 rounded-xl hover:bg-slate-50 transition">View Pricing</button>
                                <a href="contact" class="flex-[1.5] bg-[#102C57] text-white text-center font-bold py-3.5 rounded-xl hover:bg-[#1a3e75] transition flex items-center justify-center">Inquire & Book</a>
                            </div>
                        </div>

                    </div>
                `).join('');
            });
        });

        // type 파라미터를 추가하여 사진(image)과 가격표(price)를 분기 처리
        function openModal(index, type) {
            const item = allData[index];
            const modal = document.getElementById('dynamic-modal');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');

            if (type === 'image') {
                title.innerText = `${item.name} Detailed Photos`;
                content.innerHTML = item.images.map(path => `
                    <img src="/${path}" class="w-full rounded-2xl shadow-md border-4 border-white" onerror="this.style.display='none'">
                `).join('');
                
            } else if (type === 'price') {
                title.innerText = `${item.name} One-way Pricing by Region`;
                
                // 표에 들어갈 내용 생성
                let tableRows = item.pricing.map(p => `
                    <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
                        <td class="py-3 px-4 text-sm text-slate-700 font-medium break-keep">${p.region}</td>
                        <td class="py-3 px-4 text-sm font-bold text-[#102C57] text-right whitespace-nowrap">${p.price}</td>
                    </tr>
                `).join('');

                content.innerHTML = `
                    <div class="flex justify-end mb-3">
                        <span class="text-sm font-bold text-slate-800">목적지 숙소 위치에 따라 요금이 다를 수 있습니다.</span>
                    </div>
                    <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-[#102C57] text-white">
                                <tr>
                                    <th class="py-3 px-4 text-sm font-bold w-2/3">Route</th>
                                    <th class="py-3 px-4 text-sm font-bold w-1/3 text-right">Fare</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tableRows}
                            </tbody>
                        </table>
                    </div>
                    <p class="text-xs text-slate-500 mt-4">* The above prices are final and include all toll and parking fees.</p>
                `;
            }

            modal.classList.remove('hidden');
            document.body.classList.add('modal-open');
        }
        
        function closeModal() {
            document.getElementById('dynamic-modal').classList.add('hidden');
            document.body.classList.remove('modal-open');
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
