<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호호모빌리티 | About Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/site.css">
    <script src="/js/site-components.js" defer></script>
</head>
<body class="flex flex-col min-h-screen">
    <site-header active="about" lang="ko"></site-header>

    <main class="flex-grow pt-24 pb-16">
        <section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
            <div class="mb-12 text-center">
                <h2 class="text-3xl font-bold text-[#102C57] mb-4">국내 최대 수준의 다양한 라인업</h2>
                <p class="text-lg text-slate-600 leading-relaxed">단 한 대의 차량이 아닙니다. 인원과 짐 규모에 상관없이 즉시 배차가 가능한 대규모 플릿을 운영합니다.</p>
            </div>
            <div class="grid md:grid-cols-3 gap-8 mb-16 text-center">
                <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm transition hover:shadow-md">
                    <div class="text-5xl mb-4">🚐</div>
                    <h3 class="text-xl font-bold text-[#102C57] mb-3">대규모 차량 보유</h3>
                    <p class="text-slate-600 text-sm leading-relaxed">현대 스타리아, 쏠라티부터 벤츠 스프린터까지 대량의 차량을 보유하여 어떤 예약도 놓치지 않습니다.</p>
                </div>
                <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm transition hover:shadow-md">
                    <div class="text-5xl mb-4">👨‍👩‍👧‍👦</div>
                    <h3 class="text-xl font-bold text-[#102C57] mb-3">맞춤형 배차</h3>
                    <p class="text-slate-600 text-sm leading-relaxed">소규모 가족부터 10인 이상의 단체 게스트까지 모두 수용 가능한 풀라인업을 갖추고 있습니다.</p>
                </div>
                <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm transition hover:shadow-md">
                    <div class="text-5xl mb-4">✨</div>
                    <h3 class="text-xl font-bold text-[#102C57] mb-3">철저한 관리</h3>
                    <p class="text-slate-600 text-sm leading-relaxed">모든 차량은 매일 내부 살균 소독 및 정비를 통해 최상의 컨디션을 유지합니다.</p>
                </div>
            </div>
            <div class="flex justify-center"><img src="/img/logo.jpg" alt="Logo" class="h-40 opacity-90 mix-blend-multiply"></div>
        </section>
    </main>

    <site-footer lang="ko"></site-footer>
</body>
</html>
